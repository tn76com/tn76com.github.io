    <main class="container-narrow tool-page">
      <p class="tool-meta">Everyday tools</p>
      <h1>Tip Calculator</h1>
      <p class="tool-excerpt">Work out the tip and the total, split evenly across however many people were at the table.</p>
      
      <div class="calc">
        <div class="calc-grid calc-grid-3">
          <div class="calc-field"><label for="tipBill">Bill amount ($)</label><input type="number" id="tipBill" min="0" step="0.01" placeholder="e.g. 85.00" /></div>
          <div class="calc-field"><label for="tipPct">Tip percent</label><input type="number" id="tipPct" min="0" step="1" placeholder="e.g. 18" /></div>
          <div class="calc-field"><label for="tipPeople">Split between</label><input type="number" id="tipPeople" min="1" step="1" placeholder="e.g. 4" /></div>
        </div>
        <div class="calc-result" id="tipResult" hidden>
          <div class="calc-row"><span>Tip</span><span id="tipAmount"></span></div>
          <div class="calc-row"><span>Total</span><span id="tipTotal"></span></div>
          <div class="calc-row calc-main"><span>Per person</span><span id="tipPerPerson"></span></div>
        </div>
        <p class="calc-hint" id="tipHint">Fill in all three to see the split.</p>
      </div>
  
      <p class="tool-back"><a href="/tools/">&larr; All tools</a></p>
    </main>
    <script>

    (function () {
      var bill = document.getElementById("tipBill"), pct = document.getElementById("tipPct"), people = document.getElementById("tipPeople");
      var result = document.getElementById("tipResult"), hint = document.getElementById("tipHint");
      var amountOut = document.getElementById("tipAmount"), totalOut = document.getElementById("tipTotal"), perOut = document.getElementById("tipPerPerson");
      function money(n) { return "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
      function recompute() {
        var b = parseFloat(bill.value), p = parseFloat(pct.value), n = parseFloat(people.value);
        if (!(b >= 0) || !(p >= 0) || !(n > 0)) { result.hidden = true; hint.hidden = false; return; }
        var tip = b * p / 100;
        var total = b + tip;
        amountOut.textContent = money(tip);
        totalOut.textContent = money(total);
        perOut.textContent = money(total / n);
        result.hidden = false; hint.hidden = true;
      }
      [bill, pct, people].forEach(function (el) { el.addEventListener("input", recompute); });
    })();
  
    </script>
