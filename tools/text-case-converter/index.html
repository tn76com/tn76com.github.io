    <main class="container-narrow tool-page">
      <p class="tool-meta">Developer tools</p>
      <h1>Text Case Converter</h1>
      <p class="tool-excerpt">Convert text to UPPERCASE, lowercase, Title Case, Sentence case, camelCase, snake_case or kebab-case.</p>
      
      <div class="calc">
        <div class="calc-field">
          <label for="tcText">Your text</label>
          <textarea id="tcText" rows="6" placeholder="Type or paste here..."></textarea>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-secondary" data-case="upper">UPPERCASE</button>
          <button type="button" class="btn btn-secondary" data-case="lower">lowercase</button>
          <button type="button" class="btn btn-secondary" data-case="title">Title Case</button>
          <button type="button" class="btn btn-secondary" data-case="sentence">Sentence case</button>
          <button type="button" class="btn btn-secondary" data-case="camel">camelCase</button>
          <button type="button" class="btn btn-secondary" data-case="snake">snake_case</button>
          <button type="button" class="btn btn-secondary" data-case="kebab">kebab-case</button>
        </div>
        <div class="tool-output" id="tcOutput" hidden></div>
        <div class="btn-row" id="tcCopyRow" hidden>
          <button type="button" class="btn btn-primary" id="tcCopy">Copy result</button>
        </div>
        <p class="copy-msg" id="tcMsg"></p>
      </div>
  
      <p class="tool-back"><a href="/tools/">&larr; All tools</a></p>
    </main>
    <script>

    (function () {
      var text = document.getElementById("tcText"), output = document.getElementById("tcOutput"), copyRow = document.getElementById("tcCopyRow"), msg = document.getElementById("tcMsg");

      function words(s) { return s.trim().split(/\s+/).filter(Boolean); }
      var CONVERTERS = {
        upper: function (s) { return s.toUpperCase(); },
        lower: function (s) { return s.toLowerCase(); },
        title: function (s) { return s.toLowerCase().replace(/\b\w/g, function (c) { return c.toUpperCase(); }); },
        sentence: function (s) {
          var lower = s.toLowerCase();
          return lower.replace(/(^\s*\w|[.!?]\s+\w)/g, function (c) { return c.toUpperCase(); });
        },
        camel: function (s) {
          var w = words(s).map(function (x) { return x.toLowerCase(); });
          return w.map(function (x, i) { return i === 0 ? x : x.charAt(0).toUpperCase() + x.slice(1); }).join("");
        },
        snake: function (s) { return words(s).map(function (x) { return x.toLowerCase(); }).join("_"); },
        kebab: function (s) { return words(s).map(function (x) { return x.toLowerCase(); }).join("-"); },
      };

      document.querySelectorAll("[data-case]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (!text.value.trim()) { return; }
          output.textContent = CONVERTERS[btn.dataset.case](text.value);
          output.hidden = false;
          copyRow.hidden = false;
          msg.textContent = "";
        });
      });
      document.getElementById("tcCopy").addEventListener("click", function () {
        navigator.clipboard.writeText(output.textContent).then(function () {
          msg.textContent = "Copied.";
          setTimeout(function () { msg.textContent = ""; }, 1800);
        });
      });
    })();
  
    </script>
